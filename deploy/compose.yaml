services:
  prosa-api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      PROSA_DATA_DIR: /var/lib/prosa
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:?Set CLIENT_ORIGIN in .env.production}
      TRUST_PROXY: "1"
      TURN_URL: ${TURN_URL:?Set TURN_URL in .env.production}
      TURN_SHARED_SECRET: ${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET in .env.production}
    expose:
      - "8787"
    volumes:
      - prosa-data:/var/lib/prosa
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  prosa-web:
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  coturn:
    image: coturn/coturn:4.18.0
    network_mode: host
    command:
      - "--log-file=stdout"
      - "--external-ip=${TURN_EXTERNAL_IP:?Set TURN_EXTERNAL_IP in .env.production}"
      - "--listening-port=3478"
      - "--min-port=49160"
      - "--max-port=49200"
      - "--fingerprint"
      - "--use-auth-secret"
      - "--static-auth-secret=${TURN_SHARED_SECRET:?Set TURN_SHARED_SECRET in .env.production}"
      - "--realm=${PROSA_DOMAIN:?Set PROSA_DOMAIN in .env.production}"
      - "--user-quota=4"
      - "--total-quota=1000"
      - "--no-multicast-peers"
      - "--no-loopback-peers"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  caddy:
    image: caddy:2.11.4-alpine
    depends_on:
      prosa-api:
        condition: service_healthy
      prosa-web:
        condition: service_started
    environment:
      PROSA_DOMAIN: ${PROSA_DOMAIN:?Set PROSA_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  prosa-data:
  caddy-data:
  caddy-config:
