name: Prosa checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-and-api:
    name: ${{ matrix.os }} · Node.js 22
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Select a native build tool for the Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm install --global node-gyp@13.1.0
          $nodeGypPath = Join-Path (npm root -g) 'node-gyp\bin\node-gyp.js'
          npm config set node_gyp $nodeGypPath
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
