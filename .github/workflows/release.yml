name: Prosa release

on:
  push:
    tags: [v*]

permissions:
  contents: write

jobs:
  verify:
    name: Tests and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  windows:
    name: Windows installer
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v6
        with:
          name: release-windows
          path: artifacts/Prosa-Setup-*.exe
          if-no-files-found: error

  linux:
    name: Linux packages
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - run: npx electron-builder --linux AppImage deb --publish never
      - name: Smoke test Linux desktop package
        run: xvfb-run -a node tests/desktop-smoke.mjs artifacts/linux-unpacked/prosa
      - uses: actions/upload-artifact@v6
        with:
          name: release-linux
          path: |
            artifacts/Prosa-*-amd64.deb
            artifacts/Prosa-*-x86_64.AppImage
          if-no-files-found: error

  android:
    name: Android preview APK
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      - run: npm run android:sync
      - run: ./gradlew assembleDebug
        working-directory: android
      - name: Name preview APK
        shell: bash
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Prosa-Android-${GITHUB_REF_NAME}-debug-preview.apk
      - uses: actions/upload-artifact@v6
        with:
          name: release-android
          path: Prosa-Android-*-debug-preview.apk
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v6
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish release with compiled packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          gh release create "$TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Prosa $TAG" \
            --notes-file "docs/releases/${VERSION}-announcement.md"
