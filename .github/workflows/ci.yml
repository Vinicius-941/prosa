name: Prosa checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-and-api:
    name: ${{ matrix.os }} · Node.js 22
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: linux
          - os: windows-2022
            package: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run build:service
      - run: npx electron-builder --dir --${{ matrix.package }} --publish never
