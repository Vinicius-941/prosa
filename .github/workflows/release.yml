name: Prosa desktop release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    name: ${{ matrix.os }} desktop installers
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
          - os: windows-2022
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      - run: npx electron-builder --${{ matrix.target }} --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: prosa-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android preview APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      - run: npm run android:sync
      - run: ./gradlew assembleDebug
        working-directory: android
      - name: Name preview package
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "Prosa-Android-${GITHUB_REF_NAME}-debug-preview.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: prosa-android
          path: Prosa-Android-*-debug-preview.apk
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: prosa-*
          path: release-files
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release view "$TAG_NAME" >/dev/null 2>&1 || gh release create "$TAG_NAME" --generate-notes
          gh release upload "$TAG_NAME" release-files/* --clobber
