name: Prosa checks

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android · APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: npm ci
      - run: npm run android:sync
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v6
        with:
          name: prosa-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  client-and-api:
    name: ${{ matrix.os }} · Node.js 22
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            package: linux
          - os: windows-2022
            package: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run build:service
      - if: matrix.os == 'ubuntu-latest'
        run: npx playwright install --with-deps chromium
      - if: matrix.os == 'ubuntu-latest'
        run: npm run test:e2e
      - if: matrix.os == 'ubuntu-latest'
        run: npm run benchmark:service -- --messages=100 --concurrency=5
      - run: npx electron-builder --dir --${{ matrix.package }} --publish never

  service-container:
    name: Service container · health check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build service image
        run: docker build --tag prosa-api:ci .
      - name: Start service and check health
        shell: bash
        run: |
          docker run --detach --rm --name prosa-api-ci \
            --publish 127.0.0.1:18787:8787 \
            --env NODE_ENV=production \
            --env CLIENT_ORIGIN=https://localhost \
            prosa-api:ci
          cleanup() { docker stop prosa-api-ci >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18787/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs prosa-api-ci
          exit 1
